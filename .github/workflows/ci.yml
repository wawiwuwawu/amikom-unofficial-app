name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # .env tidak pernah di-commit (lihat .gitignore), tapi terdaftar
      # sebagai asset di pubspec.yaml — jadi perlu dibuat dari template.
      # Nilai CI (API_BASE_URL dll.) di-override dari repository VARIABLES
      # (`gh variable set`) — non-secret; jangan pernah commit .env asli.
      - name: Prepare .env from template + CI overrides
        run: |
          cp .env.example .env
          if [ -n "${{ vars.API_BASE_URL }}" ]; then sed -i "s|^API_BASE_URL=.*|API_BASE_URL=${{ vars.API_BASE_URL }}|" .env; fi
          if [ -n "${{ vars.SEC_KEY_USER }}" ]; then sed -i "s|^SEC_KEY_USER=.*|SEC_KEY_USER=${{ vars.SEC_KEY_USER }}|" .env; fi
          if [ -n "${{ vars.SEC_KEY_PASS }}" ]; then sed -i "s|^SEC_KEY_PASS=.*|SEC_KEY_PASS=${{ vars.SEC_KEY_PASS }}|" .env; fi

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze

      - name: Run tests
        run: flutter test