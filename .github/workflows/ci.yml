name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # .env tidak pernah di-commit (lihat .gitignore), tapi terdaftar
      # sebagai asset di pubspec.yaml — jadi perlu dibuat dari template.
      - name: Prepare .env from template
        run: cp .env.example .env

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze

      - name: Run tests
        run: flutter test