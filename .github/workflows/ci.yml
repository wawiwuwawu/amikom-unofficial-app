name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # .env tidak pernah di-commit (lihat .gitignore), tapi terdaftar
      # sebagai asset di pubspec.yaml — jadi perlu dibuat dari template.
      # Nilai lewat env (bukan substitusi ke teks skrip) dan di-escape untuk
      # karakter khusus sed. Di sini tidak wajib: analyze/test memakai template.
      - name: Prepare .env from template + CI overrides
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          cp .env.example .env
          if [ -n "$API_BASE_URL" ]; then
            esc=$(printf '%s' "$API_BASE_URL" | sed 's/[\\&|]/\\&/g')
            sed -i "s|^API_BASE_URL=.*|API_BASE_URL=$esc|" .env
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze

      - name: Run tests
        run: flutter test