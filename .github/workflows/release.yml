name: Build APK & Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      # Runner ubuntu-latest mulai membawa Java 25 yang tidak didukung
      # Gradle 8.14 (upaya rilis v1.14.0 pertama gagal karenanya) —
      # pin JDK LTS 21 agar build release stabil lintas perubahan image.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Prasyarat rilis: catatan untuk tag ini harus sudah ada di CHANGELOG.
      # Ditaruh sebelum build supaya gagal dalam hitungan detik, bukan 40 menit.
      - name: Extract release notes from CHANGELOG
        run: |
          V="${GITHUB_REF_NAME#v}"
          awk -v pat="## [v${V}]" 'index($0,pat)==1{f=1;next} f&&/^## \[/{exit} f' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "::error::Bagian [v${V}] tidak ditemukan di CHANGELOG.md — tulis dulu sebelum tag."
            exit 1
          fi
          head -5 RELEASE_NOTES.md

      # .env asli tidak pernah masuk git (gitignore). CI membuatnya dari
      # template lalu menimpa nilai dari repository VARIABLES. Di jalur rilis,
      # API_BASE_URL WAJIB ada: tanpa itu APK akan memakai URL placeholder
      # http://localhost:3000 dari .env.example dan rilis bocor tanpa gejala.
      - name: Prepare .env from template + CI overrides
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          cp .env.example .env
          if [ -z "$API_BASE_URL" ]; then
            echo "::error::repository variable API_BASE_URL belum diset — jalankan: gh variable set API_BASE_URL --body https://host-anda/"
            exit 1
          fi
          esc=$(printf '%s' "$API_BASE_URL" | sed 's/[\\&|]/\\&/g')
          sed -i "s|^API_BASE_URL=.*|API_BASE_URL=$esc|" .env


      # google-services.json milik developer (gitignore). Di jalur rilis CI,
      # file disuntikkan dari repository SECRET agar APK release membawa konfigurasi FCM.
      - name: Prepare google-services.json from CI secret
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          else
            echo "::error::repository secret GOOGLE_SERVICES_JSON belum diset — jalankan: gh secret set GOOGLE_SERVICES_JSON < android/app/google-services.json"
            exit 1
          fi
      # upload-keystore.jks + key.properties tidak pernah masuk git (gitignore).
      # Di jalur rilis CI, keduanya disuntikkan dari repository SECRET agar setiap
      # APK release ditandatangani kunci rilis yang sama — syarat mutlak agar
      # update in-app (install menimpa APK lama) tidak gagal "signature mismatch".
      - name: Prepare release keystore from CI secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ]; then
            echo "::error::repository secret ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD belum diset — jalankan: gh secret set ANDROID_KEYSTORE_BASE64 < keystore.b64 && gh secret set ANDROID_KEYSTORE_PASSWORD --body '...'"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=upload
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v3
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          body_path: RELEASE_NOTES.md
          generate_release_notes: false
          overwrite_files: true